[tool.pytest.ini_options]
# "src layout": el codigo vive en src/ventas/ (config.py, db.py, mappings.py,
# etc.), no en la raiz del proyecto -- se agrega al pythonpath para que los
# tests (y main.py/copiar_funnel_ventas.py/exportar_senhalizaciones_csv.py,
# que hacen lo mismo a mano via sys.path.insert) puedan seguir haciendo
# 'import mappings', 'from db import DatabaseGateway', etc. sin cambios.
pythonpath = ["src/ventas"]
