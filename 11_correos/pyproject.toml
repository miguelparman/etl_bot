[tool.pytest.ini_options]
# "src layout": el codigo vive en src/correos/, una carpeta por capa
# (comun/, ingesta/, bronze/, silver/, gold/); solo main.py queda en la raiz.
# Se agrega src/correos al pythonpath para que los tests (y main.py, que hace
# lo mismo a mano via sys.path.insert) importen 'from comun.db import ...',
# 'from bronze.cargar import ...', etc.
pythonpath = ["src/correos"]
