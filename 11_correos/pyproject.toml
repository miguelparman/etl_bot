[tool.pytest.ini_options]
# "src layout": el codigo vive en src/correos/ (config.py, db.py, mappings.py,
# etc.), no en la raiz del proyecto (solo main.py queda ahi) -- se agrega al
# pythonpath para que los tests (y main.py/cargar_correos.py/verificar_copia.py,
# que hacen lo mismo a mano via sys.path.insert) puedan seguir haciendo
# 'import config', 'from db import DatabaseGateway', etc. sin cambios.
# Mismo patron que 02_ventas/pyproject.toml.
pythonpath = ["src/correos"]
